# PROD container (CT 206) — /etc/nginx/sites-available/merrolyn
#
# This is the live prod config as of 2026-08-02 with the two audit fixes applied:
#   1. X-Forwarded-For APPENDS ($proxy_add_x_forwarded_for) instead of overwriting
#      with the peer address. Overwriting collapsed every guest into one rate-limit
#      bucket, because the only peer nginx ever sees is HAProxy.
#   2. error_page 404 -> the site's own /404.html (was the bare nginx error page).
#
# Install:
#   scp this file to proxmox2, then:
#   pct exec 206 -- bash -c 'cp /etc/nginx/sites-available/merrolyn /etc/nginx/sites-available/merrolyn.bak'
#   ... push this file to /etc/nginx/sites-available/merrolyn ...
#   pct exec 206 -- bash -c 'nginx -t && systemctl reload nginx'
# Rollback: restore merrolyn.bak and reload.

# www.merrolyn.com -> apex (canonical consolidation)
server {
    listen 80;
    server_name www.merrolyn.com;
    return 301 https://merrolyn.com$request_uri;
}
server {
    listen 80 default_server;
    server_name merrolyn.com _;
    root /var/www/merrolyn;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
    location = /health { proxy_pass http://127.0.0.1:3000/health; }
    location ~ ^/(api/|sms-webhook) {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~* \.(css|js|svg|jpg|jpeg|png|woff2?)$ { expires 7d; add_header Cache-Control public; }
}
